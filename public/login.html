<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Smart Campus Student Management System - Portal for Students.">
    <title>Login - Smart Campus Student Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Immediate bfcache (Back/Forward Cache) unlock handler -->
    <script>
        window.addEventListener('pageshow', function() {
            var s = document.getElementById('student-submit-btn');
            if (s) {
                s.disabled = false;
                s.innerHTML = '<span class="btn-text">Login to Student Portal</span> <i class="fa-solid fa-arrow-right btn-icon"></i>';
            }
            var alertBox = document.getElementById('login-alert');
            if (alertBox) alertBox.style.display = 'none';
        });
    </script>
</head>
<body class="auth-page-body">

    <!-- Campus Background Canvas with Ambient Glow -->
    <div class="campus-bg-container">
        <div class="campus-bg-overlay"></div>
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
    </div>

    <!-- Main Compact Login Card Container (Centered, Screen-Fitted, Zero Scroll) -->
    <main class="login-wrapper">
        <div class="login-card-container compact-login-card">
            
            <!-- Compact Modern Header -->
            <div class="login-compact-header">
                <div class="compact-logo-badge">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="compact-title">Smart Campus</h1>
                <p class="compact-subtitle">Student Academic Portal</p>
            </div>

            <!-- Dynamic Alert Box for Errors or Success messages -->
            <div id="login-alert" class="alert-box" style="display: none;">
                <i class="fa-solid fa-circle-exclamation alert-icon"></i>
                <span id="alert-message">Invalid credentials, please try again.</span>
            </div>

            <!-- Student Login Form -->
            <form id="student-login-form" class="auth-form active-form" novalidate>
                <input type="hidden" name="role" value="student">

                <!-- Quick Student Profile Selector Dropdown (Preserved & Modernized) -->
                <div class="student-profile-selector-box">
                    <label for="quick-student-select" class="selector-label">
                        <span class="selector-label-left">
                            <i class="fa-solid fa-user-check"></i> Select Student Profile
                        </span>
                        <span class="selector-label-badge">Auto-fill</span>
                    </label>
                    <div class="input-wrapper compact-wrapper">
                        <i class="fa-solid fa-users input-icon"></i>
                        <select id="quick-student-select" class="form-control compact-select" onchange="onStudentSelectChange(this)">
                            <option value="">-- Choose Any Student to Login --</option>
                            <option value="1">1. Rahul Sharma (CS2025001 - Computer Science)</option>
                            <option value="2">2. Priya Verma (SPSU2026002 - Electronics &amp; Comm.)</option>
                            <option value="3">3. Aarav Patel (SPSU2026003 - Mechanical Engineering)</option>
                            <option value="4">4. Ananya Iyer (SPSU2026004 - Civil Engineering)</option>
                            <option value="5">5. Rohan Gupta (SPSU2026005 - Electrical Engineering)</option>
                            <option value="6">6. Sneha Reddy (SPSU2026006 - Information Technology)</option>
                            <option value="7">7. Aditya Joshi (SPSU2026007 - Biotechnology &amp; Bioinfo)</option>
                            <option value="8">8. Kavya Nair (SPSU2026008 - Management Studies / MBA)</option>
                            <option value="9">9. Vikram Singh (SPSU2026009 - Computer Science)</option>
                            <option value="10">10. Neha Deshmukh (SPSU2026010 - Computer Science)</option>
                        </select>
                    </div>
                </div>

                <!-- Email or Roll Number Field -->
                <div class="form-group compact-group">
                    <label for="student-identifier" class="form-label compact-label">Email or Roll Number</label>
                    <div class="input-wrapper compact-wrapper">
                        <i class="fa-regular fa-id-card input-icon"></i>
                        <input 
                            type="text" 
                            id="student-identifier" 
                            name="identifier" 
                            class="form-control compact-input" 
                            placeholder="e.g. rahul@campus.edu or CS2025001"
                            autocomplete="username"
                            required
                        >
                    </div>
                    <span class="field-error" id="student-id-error"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group compact-group">
                    <div class="label-row">
                        <label for="student-password" class="form-label compact-label">Password</label>
                        <a href="#" class="forgot-link" onclick="openForgotModal(event, 'student')">Forgot?</a>
                    </div>
                    <div class="input-wrapper compact-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="student-password" 
                            name="password" 
                            class="form-control compact-input" 
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password-btn" onclick="togglePassword('student-password', this)" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <span class="field-error" id="student-pass-error"></span>
                </div>

                <!-- Remember Me Option -->
                <div class="form-options compact-options">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="student-remember" name="remember">
                        <span class="checkmark"></span>
                        <span class="checkbox-text">Remember me</span>
                    </label>
                    <span class="security-badge"><i class="fa-solid fa-shield-halved"></i> Secure Portal</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn compact-submit-btn" id="student-submit-btn">
                    <span class="btn-text">Login to Student Portal</span>
                    <i class="fa-solid fa-arrow-right btn-icon"></i>
                </button>
            </form>

            <!-- Compact Footer -->
            <div class="compact-card-footer">
                <p class="register-prompt">
                    Don't have an account? <a href="register.html" class="register-link">Register here</a>
                </p>
                <a href="index.html" class="back-home-link">
                    <i class="fa-solid fa-arrow-left"></i> Back to Campus Home
                </a>
            </div>

        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>Reset Your Password</h3>
                <button type="button" class="close-modal-btn" onclick="closeForgotModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Please enter your registered Email address or Roll Number. We will send you instructions to reset your password.</p>
                <div class="form-group">
                    <label class="form-label">Email or Roll Number</label>
                    <input type="text" id="reset-identifier" class="form-control" placeholder="Enter your email or roll number">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeForgotModal()">Cancel</button>
                <button type="button" class="submit-btn" onclick="submitPasswordReset()">Send Reset Link</button>
            </div>
        </div>
    </div>

    <!-- Client Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
