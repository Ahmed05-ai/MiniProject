<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Smart Campus Student Management System - Modern, responsive web portal for students, faculty, and administration.">
    <meta name="keywords" content="student management system, smart campus, college portal, university management">
    <title>Smart Campus - Student Management System</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Semantic Header & Navigation -->
    <header class="main-header">
        <nav class="navbar" id="navbar">
            <!-- Navigation links, logo, and login/register actions -->
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Hero Section -->
        <section class="hero-section" id="hero">
            <!-- Hero content, headline, campus overview -->
